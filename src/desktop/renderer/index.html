<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';"
    />
    <title>Hanekawa</title>
    <style>
      /*
        Semantic names, not literals, for the same reason `src/tui/theme.ts` is a
        frozen object: a view asks for "danger", never for a hex value, so the two
        shells can be re-skinned independently without hunting for colours.
      */
      :root {
        --bg: #1a1a1a;
        --bg-raised: #232323;
        --bg-input: #252526;
        --fg: #d4d4d4;
        --muted: #808080;
        --accent: #4ec9b0;
        --user: #569cd6;
        --error: #f48771;
        --warning: #d7ba7d;
        --success: #6a9955;
        --danger: #f14c4c;
        --border: #2d2d2d;
        --border-strong: #3f3f3f;
        --diff-add-fg: #b5cea8;
        --diff-add-bg: #1e2a1e;
        --diff-del-fg: #f4a49b;
        --diff-del-bg: #2c1e1e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      [hidden] { display: none !important; }

      /* --- status bar --- */
      #status {
        flex: 0 0 auto;
        padding: 6px 12px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 16px;
        align-items: baseline;
      }
      #status .dot { color: var(--accent); margin-right: 4px; }
      #status-session { margin-left: auto; }

      /* --- tab bar (multi-tab) --- */
      #tab-bar {
        flex: 0 0 auto;
        display: flex;
        align-items: stretch;
        gap: 2px;
        padding: 4px 6px;
        background: var(--bg-raised);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        overflow-y: hidden;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        max-width: 220px;
        min-width: 80px;
      }
      .tab.active {
        background: var(--bg-raised);
        color: var(--fg);
        border-color: var(--border-strong);
      }
      .tab .tab-title {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
      }
      .tab.active .tab-title { color: var(--accent); }
      .tab .tab-close {
        background: transparent;
        color: var(--muted);
        border: 0;
        padding: 0 4px;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        border-radius: 3px;
      }
      .tab .tab-close:hover { color: var(--danger); background: var(--bg-input); }
      .tab-add {
        background: transparent;
        color: var(--muted);
        border: 1px dashed var(--border-strong);
        border-radius: 4px;
        padding: 4px 10px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .tab-add:hover { color: var(--accent); border-color: var(--accent); }

      /* --- transcript --- */
      #transcript {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px;
        font-size: 13px;
      }
      #transcript .item { margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
      #transcript .item.user { color: var(--user); }
      #transcript .item.assistant { color: var(--fg); }
      #transcript .item.thinking { color: var(--muted); font-style: italic; opacity: 0.8; }
      #transcript .item.notice { color: var(--muted); font-style: italic; }
      #transcript .item.error { color: var(--error); }
      #transcript .item.subagent { color: var(--accent); }
      #transcript .item.duration { color: var(--muted); font-size: 12px; }
      #transcript .item.tool {
        color: var(--muted);
        border-left: 2px solid var(--border-strong);
        padding-left: 8px;
      }
      #transcript .item.tool.failed { color: var(--error); border-left-color: var(--danger); }
      #transcript .item.pending::after { content: " ▌"; color: var(--accent); }
      #tool-progress {
        flex: 0 0 auto;
        padding: 4px 12px;
        color: var(--muted);
        font-size: 12px;
        border-top: 1px solid var(--border);
        white-space: pre-wrap;
      }

      /* --- surfaces (pickers, command views) --- */
      #surface {
        flex: 0 0 auto;
        max-height: 40vh;
        overflow-y: auto;
        border-top: 1px solid var(--border-strong);
        background: var(--bg-raised);
        padding: 8px 12px;
      }
      #surface h2 { font-size: 12px; margin: 0 0 6px; color: var(--accent); font-weight: 600; }
      #surface .row { display: flex; gap: 10px; padding: 2px 0; font-size: 13px; }
      #surface .row .label { min-width: 22ch; }
      #surface .row .value { color: var(--muted); flex: 1 1 auto; }
      #surface .row.current .label { color: var(--accent); }
      #surface .row.disabled { opacity: 0.55; }
      #surface .row.heading .label { color: var(--accent); }
      #surface .row.tone-success .value { color: var(--success); }
      #surface .row.tone-warning .value { color: var(--warning); }
      #surface .row.tone-error .value { color: var(--error); }
      #surface .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }

      /* --- completions --- */
      #suggestions {
        flex: 0 0 auto;
        border-top: 1px solid var(--border);
        background: var(--bg-raised);
        max-height: 30vh;
        overflow-y: auto;
      }
      #suggestions .suggestion { display: flex; gap: 10px; padding: 3px 12px; font-size: 13px; }
      #suggestions .suggestion .name { color: var(--fg); min-width: 18ch; }
      #suggestions .suggestion .description { color: var(--muted); }
      #suggestions .suggestion.selected { background: #2f3a38; }
      #suggestions .suggestion.selected .name { color: var(--accent); }

      /* --- composer --- */
      #input-row {
        flex: 0 0 auto;
        display: flex;
        border-top: 1px solid var(--border);
        padding: 8px;
        gap: 8px;
        align-items: flex-end;
      }
      #input {
        flex: 1 1 auto;
        background: var(--bg-input);
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 6px 8px;
        font: inherit;
        resize: none;
        min-height: 32px;
        max-height: 200px;
      }
      #submit, #stop {
        background: var(--accent);
        color: #000;
        border: 0;
        padding: 6px 16px;
        font: inherit;
        cursor: pointer;
      }
      #stop { background: var(--warning); }
      #submit[disabled] { opacity: 0.5; cursor: not-allowed; }

      /* --- overlay: the four blocking requests --- */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 10;
      }
      #overlay-panel {
        background: var(--bg-raised);
        border: 1px solid var(--border-strong);
        border-top-width: 3px;
        max-width: 90ch;
        width: 100%;
        max-height: 100%;
        overflow-y: auto;
        padding: 12px 16px;
        font-size: 13px;
      }
      #overlay-panel.tone-danger { border-top-color: var(--danger); }
      #overlay-panel.tone-caution { border-top-color: var(--warning); }
      #overlay-panel.tone-normal { border-top-color: var(--accent); }
      #overlay-panel .title { font-weight: 600; margin-bottom: 2px; }
      #overlay-panel.tone-danger .title { color: var(--danger); }
      #overlay-panel.tone-caution .title { color: var(--warning); }
      #overlay-panel.tone-normal .title { color: var(--accent); }
      #overlay-panel .subtitle,
      #overlay-panel .hint,
      #overlay-panel .also-waiting { color: var(--muted); font-size: 12px; }
      #overlay-panel .reason { margin: 8px 0; }
      #overlay-panel .warning { color: var(--danger); }
      #overlay-panel .streak { color: var(--warning); font-size: 12px; }
      #overlay-panel .block {
        background: var(--bg-input);
        border: 1px solid var(--border);
        padding: 6px 8px;
        margin: 8px 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #overlay-panel .block-label { color: var(--muted); font-size: 11px; }
      #overlay-panel .options { margin: 10px 0 6px; }
      #overlay-panel .option { padding: 1px 0; }
      #overlay-panel .option.selected { color: var(--accent); font-weight: 600; }
      #overlay-panel .option .hotkey { color: var(--warning); }
      #overlay-panel .plan {
        background: var(--bg-input);
        border: 1px solid var(--border);
        padding: 8px;
        margin: 8px 0;
        max-height: 40vh;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      #overlay-panel .bullets { color: var(--muted); margin: 6px 0; }
      #overlay-panel .feedback {
        background: var(--bg-input);
        border: 1px solid var(--border);
        padding: 4px 6px;
        margin: 4px 0 0 4ch;
        min-height: 1.5em;
        white-space: pre-wrap;
      }
      #overlay-panel .feedback.focused { border-color: var(--accent); }
      #overlay-panel .feedback::after { content: "▌"; color: var(--accent); }
      #overlay-panel .preview-title { color: var(--muted); font-size: 12px; margin-top: 8px; }

      /* --- diff --- */
      .diff {
        border: 1px solid var(--border);
        margin: 6px 0;
        max-height: 45vh;
        overflow: auto;
        font-size: 12px;
      }
      .diff-row { display: flex; white-space: pre; }
      .diff-row .gutter {
        flex: 0 0 8ch;
        color: var(--muted);
        text-align: right;
        padding-right: 8px;
        user-select: none;
      }
      .diff-row .text { flex: 1 1 auto; padding-right: 8px; }
      .diff-row.add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
      .diff-row.del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
      .diff-row.ctx { color: var(--fg); opacity: 0.75; }
      .diff-row.elided { color: var(--muted); font-style: italic; }
    </style>
  </head>
  <body>
    <div id="tab-bar" hidden role="tablist" aria-label="Open tabs"></div>
    <div id="status">
      <span><span class="dot">●</span><span id="status-model">…</span></span>
      <span id="status-mode">default</span>
      <span id="status-usage"></span>
      <span id="status-streaming" style="color: var(--muted);">idle</span>
      <span id="status-session"></span>
    </div>
    <div id="transcript" aria-live="polite"></div>
    <div id="tool-progress" hidden></div>
    <div id="surface" hidden></div>
    <div id="suggestions" hidden role="listbox" aria-label="Slash commands"></div>
    <form id="input-row">
      <textarea
        id="input"
        placeholder="Send a message, or /help for commands. Shift+Enter for newline."
        rows="1"
      ></textarea>
      <button id="submit" type="submit">Send</button>
      <button id="stop" type="button" hidden>Stop</button>
    </form>
    <div id="overlay" hidden role="dialog" aria-modal="true">
      <div id="overlay-panel"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

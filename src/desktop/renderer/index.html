<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';"
    />
    <title>Hanekawa</title>
    <!--
      The bundled webfonts (see `fonts.css`): the two faces the first paint
      needs — the sans body and the serif display title — are preloaded so
      their bytes arrive beside the CSS rather than after it. `crossorigin` is
      required even same-origin: fonts are always fetched in CORS mode.
    -->
    <link rel="preload" href="./fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      Two columns: the sidebar owns navigation across every project, and the
      canvas holds the one visible pane. Every pane's transcript lives inside
      `#transcript-area` as its own subtree, visibility-toggled, so switching
      sessions keeps scroll positions and repaints nothing.
    -->
    <!--
      The frameless window's own title bar (5g). It is a drag region; the OS
      still paints minimize/maximize/close into the reserved strip on its right
      (`titleBarOverlay`), which is why nothing may be drawn there.
    -->
    <header id="titlebar"></header>
    <div id="shell">
      <aside id="sidebar" aria-label="会话与项目"></aside>
      <main id="canvas">
        <!--
          The canvas header owns session identity: the title, the `⋯` menu that
          renames and deletes, and "open in editor". Built entirely from the lane
          list, so it belongs to the window rather than to any pane.
        -->
        <header id="canvas-header" hidden></header>
        <div id="transcript-area"></div>
        <!--
          The anchored composite input: one capsule holding the textarea and an
          inline action bar. `#chip-runtime` is a single status label carrying
          the model *and* the effort level; it opens a local popover whose two
          rows fly out into the levels they can take.
        -->
        <form id="input-row">
          <!--
            The composer shares the transcript's reading column, so a message and
            the answer to it sit on one axis. The status line hangs under it
            (5g): usage, cost and "生成中" are metadata about the turn being
            typed, and a strip across the top of the canvas is the one thing the
            reference builds never have.
          -->
          <div class="composer-column">
            <!--
              The three panels the composer can raise (S9): the picker / command
              view, the completion list, and the queued-message strip. They used
              to be full-bleed blocks between the transcript and the composer,
              one screen away from the chip that opens them; now they are one
              stack floating on the composer's upper edge, on the same 760px
              axis as the text. Last in the stack is `#queue`, which is the one
              that is about the message being typed.
            -->
            <div id="composer-popovers">
              <div id="surface" hidden></div>
              <div id="suggestions" hidden role="listbox" aria-label="斜杠命令"></div>
              <div id="queue" hidden aria-live="polite" aria-label="排队消息"></div>
            </div>
            <div id="composer">
              <!--
                A short placeholder, deliberately: the keys it used to spell out
                (Shift+Enter, `/`) live in the sidebar's `?` panel, and a
                sentence-long placeholder is the first thing that reads as a
                prototype.
              -->
              <textarea id="input" placeholder="随心输入" rows="1"></textarea>
              <div id="composer-bar">
                <button id="composer-attach" type="button"></button>
                <!--
                  The permission-mode pill. Its menu is built into this shell by
                  `dom/composerView.ts`, which is why the shell is positioned and
                  the trigger is not.
                -->
                <div id="composer-permission">
                  <button id="chip-permission" type="button">…</button>
                </div>
                <span class="composer-spacer"></span>
                <span id="composer-progress" hidden></span>
                <!--
                  One status label for both fields. Its menu is built into this
                  shell by `dom/composerView.ts` — same construction as the
                  permission pill, which is why the shell is positioned and the
                  trigger is not.
                -->
                <div id="composer-chip">
                  <button id="chip-runtime" type="button">…</button>
                </div>
                <button id="stop" type="button" hidden></button>
                <button id="submit" type="submit"></button>
              </div>
            </div>
            <div id="status">
              <span id="status-streaming"></span>
              <span id="status-usage"></span>
              <span id="status-cost"></span>
            </div>
          </div>
        </form>
        <!--
          The settings screen fills the canvas rather than floating over the
          window: it is a screen, not a dialog, and nothing in the agent loop
          waits on it. `#canvas.settings-open` hides its siblings from the
          stylesheet, so no view has to know about the others.
        -->
        <section id="settings" hidden aria-label="设置"></section>
        <!--
          The two modal layers live *inside* the canvas (S6): a blocking request
          belongs to one lane and parks that lane's agent loop, so it covers that
          lane's canvas rather than the window. The sidebar stays fully usable
          beneath them — switching to another session while one is parked is a
          supported move, not something to dim out. Last two children, so DOM
          order and stacking order say the same thing.

          Which is also why neither carries `aria-modal="true"` any more: that
          attribute tells a screen reader everything outside the dialog is inert,
          and the sidebar is not.
        -->
        <div id="rewind" hidden role="dialog" aria-label="回退">
          <div id="rewind-panel"></div>
        </div>
        <div id="overlay" hidden role="dialog">
          <div id="overlay-panel"></div>
        </div>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

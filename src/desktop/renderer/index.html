<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';"
    />
    <title>Hanekawa</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      Two columns: the sidebar owns navigation across every project, and the
      canvas holds the one visible pane. Every pane's transcript lives inside
      `#transcript-area` as its own subtree, visibility-toggled, so switching
      sessions keeps scroll positions and repaints nothing.
    -->
    <div id="shell">
      <aside id="sidebar" aria-label="会话与项目"></aside>
      <main id="canvas">
        <div id="status">
          <span id="status-mode">default</span>
          <span id="status-usage"></span>
          <span id="status-cost"></span>
          <span id="status-streaming">idle</span>
          <span id="status-session"></span>
        </div>
        <div id="transcript-area"></div>
        <div id="surface" hidden></div>
        <div id="suggestions" hidden role="listbox" aria-label="斜杠命令"></div>
        <div id="queue" hidden aria-live="polite" aria-label="排队消息"></div>
        <!--
          The anchored composite input: one capsule holding the textarea and an
          inline action bar. `#chip-model` / `#chip-effort` are two buttons drawn
          as one pill — nesting buttons is invalid, and each half opens a
          different picker.
        -->
        <form id="input-row">
          <div id="composer">
            <textarea
              id="input"
              placeholder="给 Hanekawa 发消息，或用 / 唤出命令。Shift+Enter 换行。"
              rows="1"
            ></textarea>
            <div id="composer-bar">
              <button id="composer-attach" type="button"></button>
              <span class="composer-spacer"></span>
              <div id="composer-chip" role="group" aria-label="模型与思考强度">
                <button id="chip-model" type="button">…</button>
                <button id="chip-effort" type="button">…</button>
              </div>
              <button id="stop" type="button" hidden></button>
              <button id="submit" type="submit"></button>
            </div>
          </div>
        </form>
      </main>
    </div>
    <div id="rewind" hidden role="dialog" aria-modal="true" aria-label="回退">
      <div id="rewind-panel"></div>
    </div>
    <div id="overlay" hidden role="dialog" aria-modal="true">
      <div id="overlay-panel"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
